[project]
name = "accenture-1t-contract-review-challenge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=15",
    "numpy",
    "plotly",
    "kaleido",
    "streamlit",
    "huggingface_hub",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "matplotlib>=3.11.1",
    "tokenizers==0.22.1",
    "scikit-learn>=1.5",
    "torch>=2.14.1",
    "transformers>=5.15.1",
    "accelerate>=1.15.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbstripout>=0.7",
]
